name: release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
            bin_name: codepods
          - os: ubuntu-latest
            rid: linux-arm64
            ext: tar.gz
            bin_name: codepods
          - os: macos-latest
            rid: osx-arm64
            ext: tar.gz
            bin_name: codepods
          - os: windows-latest
            rid: win-x64
            ext: zip
            bin_name: codepods.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish CLI
        shell: bash
        run: |
          dotnet publish src/Codepods.Cli/Codepods.Cli.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o out

      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          cp "out/Codepods.Cli" "${{ matrix.bin_name }}"
          chmod +x "${{ matrix.bin_name }}"
          tar -czf "codepods-${{ matrix.rid }}.tar.gz" "${{ matrix.bin_name }}"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          Copy-Item "out/Codepods.Cli.exe" "${{ matrix.bin_name }}"
          Compress-Archive -Path "${{ matrix.bin_name }}" -DestinationPath "codepods-${{ matrix.rid }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepods-${{ matrix.rid }}
          path: codepods-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build checksums
        run: |
          find artifacts -type f -name 'codepods-*' -print0 | sort -z | xargs -0 sha256sum > checksums.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/codepods-*
            checksums.txt
