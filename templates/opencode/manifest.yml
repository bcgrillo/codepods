display_name: "OpenCode"
description: "OpenCode CLI configuration"
icon: "opencode-light.png"
icon_dark: "opencode-dark.png"
services:
  - terminal|ttyd|7681
  - web|web|4096
mounts:
  - workspace|/workspace
  - config|/root/.opencode
  - share|/root/.local/share/opencode
include_shared_template_files: true
shared_configure_script: shared-configure.sh
configure_script: configure.sh
start_command: 'tmux new-session -A -s main /usr/local/bin/opencode-start'
