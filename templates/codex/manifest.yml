display_name: "Codex"
description: "OpenAI Codex CLI configuration"
icon: "codex-light.svg"
icon_dark: "codex-dark.svg"
services:
  - terminal|ttyd|7681
mounts:
  - workspace|/workspace
  - config|/root/.codex
include_shared_template_files: true
shared_configure_script: shared-configure.sh
configure_script: configure.sh
start_command: 'tmux new-session -A -s main /usr/local/bin/codex-start'
