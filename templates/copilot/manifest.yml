display_name: "Copilot"
description: "GitHub Copilot CLI configuration"
icon: "copilot-light.svg"
icon_dark: "copilot-dark.svg"
services:
  - terminal|ttyd|7681
mounts:
  - workspace|/workspace
  - config|/root/.copilot
include_shared_template_files: true
shared_configure_script: shared-configure.sh
configure_script: configure.sh
start_command: 'tmux new-session -A -s main /usr/local/bin/copilot-start'
